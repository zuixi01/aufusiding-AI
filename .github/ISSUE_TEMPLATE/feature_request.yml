name: 功能请求
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望看到的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能要解决什么问题？
      placeholder: 当我尝试 ... 的时候，我发现 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望如何解决这个问题？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？

  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      options:
        - 核心引擎 (core)
        - Agent 集群 (agent)
        - 环境计算 (ambient)
        - 普罗万物 (iot)
        - 数据隐私 (privacy)
        - 插件系统 (plugins)
        - CLI 工具 (cli)
        - HTTP API (server)
        - FFI 绑定 (ffi)
        - 文档 (docs)
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 任何有助于理解这个请求的上下文、截图或参考链接

name: Security Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # 每周一 UTC 06:00

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: cargo audit
